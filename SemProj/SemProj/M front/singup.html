<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url("BGG.jpg") no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(1px);
    }

    .signup-box {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 40px 50px;
      width: 380px;
      color: #fff;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    .signup-box h2 {
      margin-bottom: 25px;
      font-size: 30px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 1px;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    .input-box input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      outline: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.3);
      color: #000;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-box input:focus {
      background: rgba(255,255,255,0.5);
    }

    .input-box input::placeholder {
      color: #000;
      font-weight: 500;
    }

    .btn, .otp-btn {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn:hover, .otp-btn:hover {
      background: linear-gradient(135deg, #66bb6a, #388e3c);
    }

    .links {
      margin-top: 18px;
      font-size: 14px;
    }

    .links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* Hide OTP button initially */
    #otpBtn {
      display: none;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <div class="input-box">
        <input type="text" id="firstName" placeholder="First Name" required>
      </div>
      <div class="input-box">
        <input type="text" id="lastName" placeholder="Last Name" required>
      </div>
      <div class="input-box">
        <input type="email" id="email" placeholder="Email" required>
      </div>
      <div class="input-box">
        <input type="password" id="password" placeholder="Password" required>
      </div>
      <div class="input-box">
        <input type="password" id="confirmPassword" placeholder="Re-enter Password" required>
      </div>
      <button type="submit" class="btn">Create Account</button>
      <button type="button" id="otpBtn" class="otp-btn" onclick="window.location.href='otp.html'">Send OTP</button>


      <div class="links">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const otpBtn = document.getElementById('otpBtn');

    // Function to check if all fields are filled
    form.addEventListener('input', () => {
      const first = document.getElementById('firstName').value.trim();
      const last = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const confirm = document.getElementById('confirmPassword').value.trim();

      if (first && last && email && pass && confirm) {
        otpBtn.style.display = 'block'; // Show OTP button
      } else {
        otpBtn.style.display = 'none'; // Hide OTP button if incomplete
      }
    });

    // When OTP button is clicked
    otpBtn.addEventListener('click', () => {
      alert("OTP sent to your email!");
    });
  </script>
</body>
</html>
