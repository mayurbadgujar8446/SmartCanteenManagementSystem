<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Actions — Dashboard</title>
  <link rel="stylesheet" href="chose.css" />
</head>
<body> 
  <main class="container">

    <nav class="actions" aria-label="Bank account actions">
      <button class="action" id="Canteen"><span class="emoji">🍽️</span><span class="label">Canteen Menu</span></button>
      <button class="action" id="deposit"><span class="emoji">💵</span><span class="label">Deposit Money</span></button>
      <button class="action" id="withdraw"><span class="emoji">💸</span><span class="label">Withdraw Money</span></button>
      <button class="action" id="balance"><span class="emoji">🏦</span><span class="label">Check Balance</span></button>
      <button class="action" id="transfer"><span class="emoji">🔄</span><span class="label">Transfer Money</span></button>
      <a href="feed.html" class="action" id="Feedback"><span class="emoji">🙋</span><span class="label">Feedback</span></a>
      <button class="action" id="OrderHistory"><span class="emoji">🍔</span><span class="label">Order History</span></button>
      <button class="action" id="TransactionHistory"><span class="emoji">💳</span><span class="label">Transaction History</span></button>
      <button class="action" id="RewardPoint"><span class="emoji">🎁</span><span class="label">Reward Points</span></button>
      <a href="index.html" class="action" id="Logout"><span class="emoji">🚪</span><span class="label">Logout</span></a>
    </nav>
  
  </main>
</body>
</html>
